<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spesial Buat Kamu ✨</title>
    <meta name="description" content="Sebuah web kado ulang tahun manis untuk sahabat baik." />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const stored = localStorage.getItem("color-scheme");
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (stored === "dark" || stored === "light") {
          if (meta) meta.content = stored;
          document.documentElement.setAttribute("data-color-mode", stored);
        } else {
          if (meta) meta.content = "light dark";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-color-mode", prefersDark ? "dark" : "light");
        }
      } catch {}
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
